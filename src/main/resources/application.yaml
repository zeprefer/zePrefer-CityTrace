server:
  port: 8081
spring:
  application:
    name: citytrace
  config:
    import: optional:file:./config/application-local.yaml
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/citytrace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: your-group-id
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'

mybatis-plus:
  type-aliases-package: com.citytrace.entity # 别名扫描包


logging:
  level:
    com.citytrace: debug
  pattern:
    dateformat: mm:ss.SSS

# 优惠券列表多级缓存配置
citytrace:
  cache:
    voucher-list:
      mode: mysql
      refresh-after-write: 5s
      expire-after-write: 10m
      redis-ttl: 30m
